on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy (latest commit on that branch)
        required: true
        type: choice
        options:
          - main
      confirmation:
        description: Confirm deployment (pushes live code to the server)
        required: true
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'

name: Manual deploy

run-name: deploy ${{ github.event.inputs.branch }} branch → ${{ github.event.inputs.branch }} environment

# One FTP deploy per target at a time (parallel runs often cause control-socket timeouts).
concurrency:
  group: manual-ftp-${{ github.event.inputs.branch }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment
        if: github.event.inputs.confirmation != 'yes'
        run: |
          echo "::error::Deployment not started. Select yes in the confirmation dropdown."
          exit 1

  resolve:
    needs: gate
    if: github.event.inputs.confirmation == 'yes'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.map.outputs.branch }}
      environment: ${{ steps.map.outputs.environment }}
      ftp_server_secret: ${{ steps.map.outputs.ftp_server_secret }}
      ftp_username_secret: ${{ steps.map.outputs.ftp_username_secret }}
      ftp_password_secret: ${{ steps.map.outputs.ftp_password_secret }}
      server_dir: ${{ steps.map.outputs.server_dir }}
    steps:
      - name: Map branch to deploy target
        id: map
        env:
          SELECTED_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          case "$SELECTED_BRANCH" in
            main)
              environment=main
              ftp_server_secret=FTP_SERVER_MAIN
              ftp_username_secret=FTP_USERNAME_MAIN
              ftp_password_secret=FTP_PASSWORD_MAIN
              ;;
          esac

          {
            echo "branch=$SELECTED_BRANCH"
            echo "environment=$environment"
            echo "ftp_server_secret=$ftp_server_secret"
            echo "ftp_username_secret=$ftp_username_secret"
            echo "ftp_password_secret=$ftp_password_secret"
            echo "server_dir=/"
          } >> "$GITHUB_OUTPUT"

  web-deploy:
    name: deploy ${{ needs.resolve.outputs.branch }} branch → ${{ needs.resolve.outputs.environment }} environment
    needs: resolve
    if: github.event.inputs.confirmation == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - name: Get latest code on ${{ needs.resolve.outputs.branch }}
        uses: actions/checkout@v6
        with:
          ref: refs/heads/${{ needs.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Block zero-byte files (break FTPS data channel)
        run: |
          set -euo pipefail
          mapfile -t empty_files < <(find . -type f -size 0 \
            ! -path './.git/*' \
            ! -path './vendor/*' \
            ! -path './node_modules/*')
          if ((${#empty_files[@]} > 0)); then
            echo "::error::Zero-byte files trigger FTPS TLS errors during upload. Fix or exclude them before deploy."
            printf '%s\n' "${empty_files[@]}"
            exit 1
          fi

      - name: Sync files to ${{ needs.resolve.outputs.environment }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets[needs.resolve.outputs.ftp_server_secret] }}
          username: ${{ secrets[needs.resolve.outputs.ftp_username_secret] }}
          password: ${{ secrets[needs.resolve.outputs.ftp_password_secret] }}
          protocol: ftps
          port: 21
          security: loose
          log-level: verbose
          state-name: kumon-backend-ftp-${{ needs.resolve.outputs.environment }}
          # Backend uploads the full app (not dist/ only); allow long transfers (ms).
          timeout: 900000
          server-dir: ${{ needs.resolve.outputs.server_dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/.idea/**
            **/.vscode/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.env*
            **/.phpunit.cache/**
            **/phpunit.xml*
            **/*.md
            **/Homestead.*
